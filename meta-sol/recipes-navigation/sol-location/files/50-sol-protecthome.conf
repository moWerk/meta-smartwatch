# ProtectHome=yes, which the provider's own unit sets, makes /home, /root AND
# /run/user inaccessible. The session bus socket lives at /run/user/1000/bus, so
# the provider cannot reach the bus at all: QDBusConnection::sessionBus() comes
# back unusable, registerObject() fails and main.cpp qFatal()s before it ever
# reaches the GNSS backend.
#
#     ProtectHome=yes        ls /run/user/1000/bus -> Permission denied
#     ProtectHome=read-only  ls /run/user/1000/bus -> srw-rw-rw- ceres ceres
#
# read-only rather than no: the provider reads nothing under /home -- an
# openat/access/stat trace of a full startup shows no access there at all -- so
# only the /run/user side of the option is needed.
[Service]
ProtectHome=read-only
