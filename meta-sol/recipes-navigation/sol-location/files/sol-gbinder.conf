# libgbinder speaks a different servicemanager dialect per Android API level, and
# picks it from this setting. Its own default, in the /etc/gbinder.conf that
# libgbinder1 ships, is ApiLevel 28 -- Android 9. sol's container is Android 14.
#
# At 28 libgbinder uses the oldest AIDL servicemanager protocol, so looking up an
# AIDL service on /dev/binder finds nothing even when the service is registered:
# `service list` inside the container shows android.hardware.gnss.IGnss/default
# on handle 4, while geoclue's binder backend probes for it, gets NULL, and falls
# back to the HIDL backend, which sol's GNSS HAL does not implement. The result
# is a provider with no backend at all -- it starts, answers D-Bus, and can never
# position.
#
# At 34 the lookup succeeds and the backend initialises every interface the HAL
# offers: GNSS, AGNSS, GNSS NI, AGNSS RIL and GNSS Debug.
#
# This is a drop-in rather than an edit of libgbinder's own file, which belongs
# to that package. Verified not to disturb the HIDL users on this device:
# sensorfw's binder plugins talk to hwservicemanager and behave identically at 28
# and 34 -- same unit state, same binder fd, same adaptor set.
[General]
ApiLevel = 34
