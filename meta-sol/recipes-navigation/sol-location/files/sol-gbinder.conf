# libgbinder picks its servicemanager protocol from ApiLevel. Its default in
# libgbinder1's /etc/gbinder.conf is 28 (Android 9); sol's container is
# Android 14.
#
# At 28 an AIDL lookup on /dev/binder returns NULL even though
# android.hardware.gnss.IGnss/default is registered. geoclue's binder backend
# then falls back to HIDL, which sol's GNSS HAL does not implement, and the
# provider can never position. At 34 the lookup succeeds and GNSS, AGNSS,
# GNSS NI, AGNSS RIL and GNSS Debug all initialise.
#
# A drop-in, since the main file belongs to libgbinder. The HIDL users
# (sensorfw's binder plugins, via hwservicemanager) behave the same at 28 and 34.
[General]
ApiLevel = 34
