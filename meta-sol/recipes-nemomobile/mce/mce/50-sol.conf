# mce setting defaults for sol. Loaded by builtin-gconf's override pass, which
# globs /etc/mce/[0-9][0-9]*.conf and applies key=value lines over the compiled
# defaults. Values already saved in /var/lib/mce/builtin-gconf.values win, so
# this sets what a freshly flashed watch starts with.

# Double-tap wakeup: 1 = always. The default 2 gates the gesture on the
# proximity sensor, which sol does not have ("proximitysensor instantiation
# failed"), so tap-to-wake never fires.
/system/osso/dsm/doubletap/mode=1

# Power key with the display off: unblank and unlock. mce ships no action for
# that case, so the key did nothing on a blanked watch. The display-on bindings
# stay stock.
/system/osso/dsm/powerkey/actions_single_off=unblank,tkunlock
/system/osso/dsm/powerkey/actions_double_off=unblank,tkunlock

# Automatic brightness on (mce's default, stated explicitly). sol's TCS3701 ALS
# is reached through the Android sensor HAL, not /sys/class/sensors.
# sensors.usf.so arms its sampling from the panel state, so lux legitimately
# stops while the panel is dimmed or blanked; that is not a broken stream.
/system/osso/dsm/display/als_autobrightness=true

# Always-on display. blank_from_lpm_on_timeout defaults to 1 s, after which
# mdy_blanking_lpm_off_cb() drops LPM_ON to OFF and the AoD watchface vanishes.
# 0 does not mean "never" (the timer still fires); a large value works.
/system/osso/dsm/display/blank_from_lpm_on_timeout=3600

# LPM has to be on for any of the above to apply. mce's default is on, but a
# settings toggle can leave it off, and the screen then cuts straight to black.
/system/osso/dsm/display/use_low_power_mode=true
