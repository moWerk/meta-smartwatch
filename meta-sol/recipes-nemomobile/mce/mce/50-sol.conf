# mce setting defaults for sol. Loaded by builtin-gconf's override pass, which
# globs /etc/mce/[0-9][0-9]*.conf and applies key=value lines over the compiled
# defaults. Values already saved in /var/lib/mce/builtin-gconf.values win, so
# this sets what a freshly flashed watch starts with.

# Double-tap wakeup: 1 = always. The default is 2 = proximity, which gates the
# gesture on the proximity sensor reporting uncovered -- and sol has no proximity
# sensor at all. sensorfw says so every boot:
#
#     "proximitysensor instantiation failed"
#     SensorManagerError: "sensor has not been instantiated"
#
# so with the default the tap is evaluated against a sensor that never reports
# and tap-to-wake does not work. Nothing else on this watch consumes proximity.
/system/osso/dsm/doubletap/mode=1

# Power key when the display is OFF: unblank and unlock. mce ships no action for
# that case at all -- `mcetool` prints the "Powerkey press from display off"
# block with nothing under it -- so pressing the button on a blanked sol did
# nothing, which is most of what "the watch is not daily driveable" feels like.
# The display-ON bindings are stock and stay stock (single blank+tklock, long
# press shutdown).
/system/osso/dsm/powerkey/actions_single_off=unblank,tkunlock
/system/osso/dsm/powerkey/actions_double_off=unblank,tkunlock

# Automatic brightness ON (mce's own default; stated explicitly because this
# file previously forced it OFF and the reasoning was wrong).
#
# WITHDRAWN, 2026-08-20: the earlier "sol exposes no ALS at all" claim in this
# file was FALSE, and so was the workaround built on it. sol has a TCS3701
# ambient light sensor on the MCU. The old check looked at /sys/class/sensors,
# which is the native-driver interface -- this sensor is not there because it is
# reached through the Android sensor HAL, and sensorfw instantiates it fine
# ("Instantiated adaptor 'alsadaptor'. Valid = true").
#
# How it actually works, confirmed by comparing against the stock Wear OS
# runtime on this same watch and then verifying every step on our port:
# usf::DisplayInfoMgr inside /vendor/lib/hw/sensors.usf.so polls
# /sys/class/backlight/panel0-backlight/brightness and the DRM connector's
# panel_power_state, and pushes {status, brightness, refresh_rate} to the MCU,
# which arms the TCS3701's vsync-triggered sampling window. That whole path runs
# correctly here -- verified live: ON@60Hz -> status:1, LP@30Hz -> status:2,
# HBM@60Hz -> status:3, matching the mapping disassembled out of the blob.
#
# The "lux alternates with zeros" symptom that justified this override does not
# reproduce. Held with the display awake, lux is dead steady (60 consecutive
# samples, all 6) and autobrightness settles the panel and leaves it alone:
#
#     lux 4-6, backlight steady 71, panel ON@60Hz for 20s
#     backlight writes in 10s: 0        (the old measurement here said 256)
#     blank -> LP@30Hz, unblank -> back to 71 within 2s
#
# The zeros in the old measurement came from the display dimming and blanking
# during the sample window: sampling legitimately STOPS when the panel leaves
# ON, exactly as stock does ("Received stop sampling request for TCS3701 light
# sensor"). Reading lux across a blank and calling the result a broken stream
# was the error.
#
# So there is nothing to work around, and forcing this false costs the watch a
# working feature. Left explicit rather than deleted so nobody re-adds the
# override from the old reasoning.
/system/osso/dsm/display/als_autobrightness=true

# Always-on display: keep the low-power screen up instead of blanking it after
# one second.
#
# THE SYMPTOM (moWerk, wearing it all day): pressing the power key showed the AoD
# watchface "for roughly a second in full brightness", then the screen cut to
# black. So the launcher renders the LPM UI correctly -- it was mce blanking it
# again immediately.
#
# THE CAUSE, from mce's own debug log:
#
#     display state req: LPM_ON
#     tklock_ui_send_lpm_signal(): sending dbus signal: lpm_ui_mode_ind enabled
#     current display state = LPM_ON          <- the watchface IS drawn here
#     mdy_blanking_lpm_off_cb(): LPM-BLANK timer triggered
#     mdy_blanking_lpm_off_cb(): display state req: LPM_OFF
#     current display state = LPM_OFF -> OFF
#
# `blank_from_lpm_on_timeout` defaults to 1 SECOND, so LPM lasts exactly as long
# as moWerk described. Measured with 3600: mce enters LPM_ON and STAYS there --
# 25 s with no LPM-BLANK timer, panel ON@60Hz at backlight 83 (the dim AoD
# level) instead of OFF.
#
# Note 0 does NOT mean "never" here -- it was tried and the timer still fired.
# A large value is the working form.
#
# Things checked and ruled out along the way, so they are not retried:
#   - `use_low_power_mode` alone: necessary but not sufficient, LPM still exited
#   - `display_off_override=use-lpm`: no effect on the exit
#   - `use_ps_mode=disabled`: no effect (sol has no proximity sensor, but the
#     exit was never proximity-driven -- it was this timer)
/system/osso/dsm/display/blank_from_lpm_on_timeout=3600

# LPM has to be on for any of the above to apply. mce's default is on, but a
# fresh flash plus a settings-app toggle can leave it off, which presents as
# "the screen cuts straight to black with no transition at all".
/system/osso/dsm/display/use_low_power_mode=true
