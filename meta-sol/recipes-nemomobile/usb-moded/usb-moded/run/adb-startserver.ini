[info]
name = android-tools-adbd.service
mode = adb_mode
systemd = 1
# No `post = 1`. On configfs, configfs_set_udc() runs composite_bind, and
# ffs_func_bind() returns -ENODEV unless userspace has already written the
# FunctionFS descriptors (drivers/usb/gadget/function/f_fs.c). Starting adbd in
# the appsync pre phase writes them before the UDC is set. Upstream's
# `post = 1` suits sysfs android_usb kernels, where descriptors are kernel-side.
