[mode]
name = adb_mode
module = none
appsync = 1

[options]
# On a configfs kernel usb-moded feeds sysfs_value to
# configfs_register_function(), which mkdirs g1/functions/<value>. configfs
# requires "<type>.<instance>" (drivers/usb/gadget/configfs.c function_make());
# plain "adb" fails with -EINVAL. adbd's FunctionFS mount at /dev/usb-ffs/adb
# binds the ffs.adb instance.
sysfs_path = /sys/class/android_usb/android0/functions
sysfs_value = ffs.adb
android_extra_sysfs_path =  /sys/class/android_usb/android0/f_ffs/aliases
android_extra_sysfs_value = adb
sysfs_reset_value = none
softconnect_path = /sys/class/android_usb/android0/enable
softconnect = 1
softconnect_disconnect = 0
idProduct = D002
