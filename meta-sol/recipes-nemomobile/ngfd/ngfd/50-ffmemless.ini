# Empty supported_effects: every event uses the FF_PERIODIC sine fall-back from
# meta-asteroid's 0003-ffmemless-support-FF_PERIODIC-only-haptic-drivers.patch,
# with duration from haptic.duration in events.d.
#
# The stock list has seven effects. The CS40L26A has no FF_RUMBLE (-EINVAL) and
# its BUZZGEN path has five slots (cs40l26.h), so the sixth upload returns
# -ENOSPC and ngfd fails to start the ffmemless sink.
#
# cache_effects = true re-uploads the effect on every play so each event gets its
# own replay.length. Without it every event feels identical.
[ffmemless]

system_effects_env = NGF_FFMEMLESS_SETTINGS

cache_effects = true

supported_effects =
