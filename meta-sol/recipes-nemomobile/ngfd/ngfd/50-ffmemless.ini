# sol ships an empty supported_effects: every ngfd event resolves to the patched
# FF_PERIODIC default fall-back effect (sine), from meta-asteroid's
# 0003-ffmemless-support-FF_PERIODIC-only-haptic-drivers.patch. Per-event
# duration comes from haptic.duration in events.d, which the same patch plumbs
# into the kernel effect's replay.length.
#
# Why the stock list cannot work here. sol's CS40L26A advertises FF_PERIODIC /
# FF_SINE / FF_CUSTOM / FF_GAIN and NO FF_RUMBLE, and a non-FF_CUSTOM periodic
# effect lands on the chip's BUZZGEN path, which has exactly FIVE config slots
# (CS40L26_BUZZGEN_INDEX_END - _START = 5 in cs40l26.h). The stock list is
#   short;long;strong;batterylow;ringtone;clock;sms
# i.e. seven, so the sixth upload returns -ENOSPC, ffmemless aborts, and ngfd
# dies at startup with:
#   Vibra upload effect: No space left on device
#   ERROR: ffmemless: Could not load ngfd effects
#   ERROR: core: sink 'ffmemless' failed to initialize
# Two of the stock entries are also _TYPE = rumble, which this chip rejects
# outright with -EINVAL.
#
# cache_effects = true is REQUIRED: it makes ffmemless re-upload the effect on
# every play so each event gets its own replay.length. Without it the effect is
# uploaded once at init and every event feels identical.
[ffmemless]

system_effects_env = NGF_FFMEMLESS_SETTINGS

cache_effects = true

supported_effects =
