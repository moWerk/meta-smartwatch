# The stock unit orders After=android-system.service, which sol does not have
# (same fix as aurora's bluebinder-aurora.conf). bluebinder_wait.sh waits for
# init.svc.*bluetooth*, but sol's HAL is init.svc.pixel_watch, so the stock wait
# times out after 60 s every time.
[Unit]
After=var-lib-lxc-android-rootfs.mount sol-lxc-android.service

[Service]
ExecStartPre=
ExecStartPre=/bin/sh -c 'until /usr/bin/getprop init.svc.pixel_watch | grep -q running; do sleep 1; done'
