# Keep udev from loading the CS40L26 driver before its firmware is reachable.
#
# udev autoloads input-cs40l26-i2c by modalias before /android/vendor (where
# cs40l26.wmfw lives) is mounted. The driver uses synchronous
# request_firmware(), so the probe fails:
#     cs40l26 0-0043: Direct firmware load for cs40l26.wmfw failed, error -2
# and sol-haptics.service's later modprobe is a no-op. blacklist only stops
# modalias autoload; the explicit modprobe by name still works.
blacklist input-cs40l26-i2c
