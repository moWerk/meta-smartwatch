# Keep udev from loading the CS40L26 driver before its firmware is reachable.
#
# udev autoloads input-cs40l26-i2c by modalias as soon as the i2c device
# appears. Measured on sol: that lands at t=129.5s, while /android/vendor --
# where cs40l26.wmfw lives -- is not mounted yet, and sol-adsp-boot only starts
# at t=132.1s. The driver uses synchronous request_firmware(), so the probe
# fails outright:
#
#     cs40l26 0-0043: Direct firmware load for cs40l26.wmfw failed, error -2
#     cs40l26: probe of 0-0043 failed with error -2
#
# sol-haptics.service then runs `modprobe` on a module that is already loaded
# and already failed, so it is a no-op and the device stays unbound. Keeping
# cs40l26 out of sol-post-rootfs.conf was never enough on its own, because
# systemd-modules-load was not the only loader.
#
# blacklist suppresses ONLY modalias-triggered autoload; the explicit modprobe
# by name in sol-haptics.service still works, and pulls cl_dsp and the codec in
# via modules.dep as before.
blacklist input-cs40l26-i2c
