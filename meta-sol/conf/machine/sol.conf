#@TYPE: Machine
#@NAME: Google Pixel Watch 3
#@DESCRIPTION: Machine configuration for the Pixel Watch 3 (sol/solios)

# armv7 userspace for hybris compatibility (kernel is aarch64).
require conf/machine/include/arm/armv7a/tune-cortexa7.inc
DEFAULTTUNE = "armv7vehf-neon"
require conf/machine/include/hybris-watch.inc

# Android side runs as a Halium LXC container; drop meta-asteroid's android-init
# and meta-android's android-system (we ship our own LXC bundle).
IMAGE_INSTALL:remove = "android-init android-system"

MACHINE_HAS_WLAN = "true"
MACHINE_HAS_SPEAKER = "true"
MACHINE_DISPLAY_ROUND = "true"

# --- A14 RUNG (verify during frankenport bring-up) ---
# aurora (A13) used the A11 halium headers ("good enough") + android armv7+pie64.
# sol is A14; keep aurora's values as the starting point and climb only if the
# build/HAL surface forces it. The stock container is A14 (AW2A.240903).
PREFERRED_PROVIDER_virtual/android-system-image = "android"
PREFERRED_VERSION_android = "armv7+pie64"
PREFERRED_PROVIDER_virtual/android-headers = "android-headers-halium"
PREFERRED_VERSION_android-headers-halium = "11.0"

# SOL_KERNEL_VERSION in recipes-kernel/linux/linux-sol-version.inc.
# sol kernel is aarch64 (built from google-eos halium-13.0, same tree+SoC as aurora);
# userspace is armv7. Keep PREFERRED_VERSION in sync with SOL_KERNEL_VERSION in the .inc.
TUNE_PKGARCH:pn-linux-sol = "aarch64"
PREFERRED_PROVIDER_virtual/kernel = "linux-sol"
PREFERRED_VERSION_linux-sol = "5.15.148+git%"

# Modern kernels use configfs rather than functionfs.
PREFERRED_PROVIDER_android-tools-conf = "android-tools-conf-configfs"

# hw support packages (same set aurora ships; monaco SoC identical).
#
# bluebinder was DELIBERATELY OMITTED during early bring-up. It is
# WantedBy=multi-user.target with Restart=always and
# ExecStartPre=/usr/sbin/bluebinder_wait.sh, and it could not succeed while the
# Android container was shipped but not auto-started: the wait script looped
# forever on
#     library "liblog.so" not found
#     Waiting for bluetooth service
# and because Restart=always defeats its own TimeoutStartSec=60 the job never
# settled, so multi-user.target never activated. Measured on sol 2026-08-10:
#     JOB UNIT               TYPE  STATE
#     227 user@1000.service  start running
#       1 multi-user.target  start waiting
#     100 bluebinder.service start running
# The stated condition for re-adding it was "once the container is auto-started".
# That became true on 2026-08-15 (see sol-lxc-android's SYSTEMD_SERVICE), and the
# container now runs both BT HALs -- android.hardware.bluetooth@1.0-service-qti
# and android.hardware.bluetooth-service.pixel_watch -- so bluebinder has
# something real to proxy. Re-added.
#
# NOTE it cannot work until the kernel carries CONFIG_BT=y/CONFIG_RFKILL=y (see
# sw5100.fragment): bluebinder writes HCI packets to /dev/vhci, hci_vhci needs
# the bluetooth core, and on a GKI kernel that core cannot be a module. Ship both
# changes together or bluebinder will just sit in its wait loop again.
IMAGE_INSTALL += "sensorfw-hybris-binder-plugins udev-droid-system swclock-offset asteroid-hrm asteroid-compass"
# Bluetooth: sol's radio is a BROADCOM BCM4381A1 on a UART (qupv3-se5 ->
# /dev/ttyHS0), NOT the Qualcomm part aurora has, so it uses the same
# brcm_patchram_plus path lenok and sawfish already use rather than bluebinder.
# Verified on hardware 2026-08-16: hci0 comes up "Type: Primary Bus: UART,
# UP RUNNING" with a real feature mask -- a native kernel adapter, where aurora's
# is Bus: Virtual behind bluebinder.
IMAGE_INSTALL += "brcm-patchram-plus"

# A watch that cannot sleep looks exactly like a watch with a bad battery, and
# the cause is invisible without looking at /sys/power. mce can end up holding
# its mce_display_on wakelock with the display off, which stops the kernel
# ARMING autosleep at all -- suspend is then never even attempted and the watch
# just drains (sol spent a night this way at ~72 mA, and it silently invalidated
# three drain measurements before anyone noticed). sol-sleep-guard spots that
# exact state and nudges mce back; it deliberately does nothing when suspend is
# being attempted and aborted, which is a wakeup-source problem with a different
# fix. mce itself is shared code, so the recovery lives here rather than there.
IMAGE_INSTALL += "sol-sleep-guard"

# sol's sensors reach sensorfw only through the sol-sensors-hidl bridge (A14
# ships an AIDL sensors HAL, sensorfw speaks HIDL). After an abnormal container
# restart the HIDL HAL can end up unregistered, and sensorfw's finishConnect()
# then spins in a blocking sleep() that deafens its D-Bus interface -- which jams
# mce's plugin loads past the pending-reply cap and leaves the screen unwakeable
# on the power key. sol-sensors-guard probes sensorfw's D-Bus and, only when it
# is genuinely wedged, re-runs the container bring-up so the bridge re-applies
# and the HAL registers. sensorfw/mce are shared code, so the recovery lives here.
# Debugging sensors/the container by hand? `systemctl stop sol-sensors-guard.timer`
# first, or it will restart the container out from under the experiment.
IMAGE_INSTALL += "sol-sensors-guard"

# sol is an A/B device whose bootloader decrements the slot's tries-remaining on
# every boot and expects userspace to mark the slot successful. Nothing did:
# AOSP marks it from update_verifier on sys.boot_completed, and AsteroidOS never
# sets that property, so the binary sits unused in the container image. The
# counter walks to zero, the bootloader declares the slot UNBOOTABLE and drops
# to fastboot, and recovery needs a host. Seen for real on 2026-08-23.
IMAGE_INSTALL += "sol-mark-boot-successful"

# bluebinder DELIBERATELY NOT INSTALLED, and the reason is specific rather than
# historical. It proxies the Android HIDL BT HAL over binder to /dev/vhci, and on
# sol the only HIDL HAL is android.hardware.bluetooth@1.0-service-qti -- QUALCOMM's.
# With a VINTF fragment it will register and bluebinder will happily create an
# hci0, but that adapter never talks to anything: it sits DOWN INIT with
# TX 8 bytes / RX 0 events, because the QTI HAL does not drive a Broadcom part.
# sol's own AIDL HAL (android.hardware.bluetooth-service.pixel_watch) is the one
# stock uses, and bluebinder cannot speak AIDL. The native patchram path above
# sidesteps all of it.
# IMAGE_INSTALL += "bluebinder"

# regulatory db for cfg80211 (qcacld reads /lib/firmware/regulatory.db at init).
IMAGE_INSTALL += "wireless-regdb-static"

# /vendor: sol's stock vendor is a LOGICAL partition inside /super. Unlike aurora
# (slot B, mmcblk0p80), sol's ACTIVE SLOT is _a and super=mmcblk0p80. sol-vendor-
# mount recreates the dm-linear mapping (offset from lpdump) and mounts /vendor so
# Halium HAL services resolve /vendor/bin/hw/*.
IMAGE_INSTALL += "sol-vendor-mount"

# Halium Android system image. Mounted and its APEXes bound; the LXC container
# is NOT started yet -- that is the next step and is deliberately separable.
#
# Required, not optional: sol's own stock A14 /system cannot be used under
# libhybris. libhybris skips libc.so's constructors and stock A14 bionic then
# faults at NULL+0x410 before main(). Swapping in a Halium-built system took the
# launcher from crashing inside bionic to reaching EGL init against the real
# Adreno driver. See meta-sol/recipes-android/sol-lxc-android.
IMAGE_INSTALL += "sol-lxc-android"
IMAGE_INSTALL += "lxc"

# Ship out-of-tree vendor modules to the rootfs /lib/modules/${KREL}/vendor.
IMAGE_INSTALL += "linux-sol-modules"

# Post-rootfs auto-load of WLAN/ASoC/BT modules after pivot_root.
IMAGE_INSTALL += "sol-modules-autoload"

# Clear the qcom-lpm governor's sleep_disabled boot default so cluster/system
# low-power modes engage (the ~27 mA suspend-floor fix).
IMAGE_INSTALL += "sol-lpm-enable"

# gralloc shim: NOT needed as a separate recipe. The Halium system image ships
# libui_compat_layer.so in /system/lib, and it is on the hybris search path, so
# libhybris takes its gralloc4 branch without us building anything. Confirmed on
# hardware 2026-08-10: the library is loaded in the launcher's address space and
# the gralloc4 probe succeeds. An earlier note here predicted an A14 shim would
# be "the mandatory first rung" -- that turned out not to be the blocker.

# Bring-up: persistent journal from the first entry (see the recipe for why
# this is standalone and not a systemd bbappend).
IMAGE_INSTALL += "sol-journal-config"

# AUDIO BRING-UP TOOLING -- none of this was on the image, which meant the sound
# stack could not even be probed, let alone tested: no amixer, no aplay, no
# tinymix, no tinyplay. sol loads the whole ASoC stack natively already
# (machine_dlkm + bolero/wcd/wsa/macros/swr via sol-post-rootfs.conf), so the
# kernel side is expected to enumerate a card; what was missing was any way to
# set a mixer control or push a sample at it.
#
# This block used to argue that the PulseAudio droid modules cannot work on an
# A14 base because they are HIDL clients. That is wrong: sol plays through
# module-droid-card with droid-merhybris and droid-hidl, the same versions
# aurora runs, once the ADSP is reachable over QRTR. The AudioReach HAL AGM
# exposes is HIDL regardless of the platform's audio HAL generation.
#
# Speaker routing needs exactly four mixer controls, taken from sol's own
# /vendor/etc/audio/sku_monaco/mixer_paths_monaco_idp_google.xml:
#     RX_MACRO RX0 MUX     = AIF1_PB
#     RX INT2_1 MIX1 INP0  = RX0
#     SWR DAC_Port Switch  = 1
#     VISENSE Switch       = 1
# See ~/WatchPort/scripts/sol-audio-probe.sh, which applies them and plays a tone.
IMAGE_INSTALL += "alsa-utils-amixer alsa-utils-aplay alsa-utils-alsactl alsa-utils-speakertest"

# The policy configuration module-droid-card is pointed at, filtered out of the
# vendor image's own at boot. See the recipe for what has to be removed and why.
IMAGE_INSTALL += "sol-audio-policy"

# Location. geoclue is in no packagegroup, so it has to be asked for by name;
# the binder location provider comes with it through the geoclue bbappend, which
# is where the reasoning for the binder backend over the libhybris one lives.
# sol-location carries the two settings that let that provider reach sol's AIDL
# GNSS HAL at all.
IMAGE_INSTALL += "geoclue sol-location"

# BRING-UP: adb after switch_root. usb-moded's udev cable watch dies on sol
# ("udev io watch disabled") so it never applies adb_mode and there is no adb at
# all once the rootfs takes over -- every failed boot then costs a fastboot
# button combo. sol-bringup-adb masks usb-moded and binds the gadget itself.
# REMOVE once usb-moded is fixed; see the recipe header for what is already
# ruled out.
IMAGE_INSTALL += "sol-bringup-adb"

# sol has no modem (kernel prints modem_supported=0x0 every boot). Unbind the
# modem remoteproc at boot so nothing can start it. Unbinds ONLY the modem; adsp
# shares the driver and keeps working.
#
# CORRECTED 2026-08-15: an earlier version of this comment claimed this was the
# fix for the SoC reset ("mss bound -> container resets the watch in ~10s").
# That causal claim is wrong. The reset kept reproducing for days with this in
# place, and was finally bisected to the container parsing
# /vendor/etc/init/hw/init.swp5100.usb.rc -- see sol-lxc-android-start.sh's USB
# mask. What the 08-13 measurement actually showed is not established; it was
# most likely the usual latency variance being read as a fix.
#
# Kept anyway, on its own merits rather than as a reset fix: a unit with no
# modem has no business running a modem remoteproc. It has never been tested
# whether the reset also needs this unbind, because every reset round ran with
# it active, so removing it is an untested change, not an obvious cleanup.
IMAGE_INSTALL += "sol-no-modem"

# The AIDL hwc2 compat layer the launcher needs to see sol's composer3 HAL.
# Overlaid into the Halium system image at runtime; see the recipe for why it
# cannot simply be installed into that path.
IMAGE_INSTALL += "sol-hwc2-aidl"

# Brings up the ADSP, where the USF sensor sub-HAL runs. Without it remoteproc0
# stays offline and no sensor can ever enumerate.
IMAGE_INSTALL += "sol-adsp-boot"

# HIDL sensors front-end + its VINTF fragment. sol's vendor ships only the AIDL
# sensors service; sensorfw is a HIDL client, so without this it sees no sensors
# at all. See the recipe for why swapping only the front-end is safe.
IMAGE_INSTALL += "sol-sensors-hidl"

# Keeps nanohub's shared 20-buffer pool from being stranded by channels nothing
# reads. Without it, ~20 unread messages on any one of brightness/display/
# render/debug_log/metrics/console/pele stalls the driver's reader kthread and
# every sensor on the watch dies. NOT YET HARDWARE-VERIFIED -- source analysis
# only; see .investigation-logs/20260816_sol_nanohub_pool_exhaustion.md.
IMAGE_INSTALL += "sol-nanohub-drain"

# CS40L26 haptics. sol's vibrator is a Cirrus CS40L26A LRA driver on i2c 0x43
# (DTS: compatible "cirrus,cs40l26a" with f0/redc/vibe-state + svc calibration).
# The modules are built by linux-sol-modules; this unit loads them AFTER
# sol-adsp-boot, because the driver uses synchronous request_firmware() and its
# firmware lives in the Android vendor image.
# NOTE nothing in userspace drives it yet -- the driver exposes an FF_PERIODIC/
# FF_CUSTOM input device (FF_RUMBLE is deliberately stripped) and AsteroidOS has
# no native evdev/FF ngfd backend. Loading it proves the hardware only.
IMAGE_INSTALL += "sol-haptics"

# WiFi/BT firmware for sol's Synaptics/Broadcom BCM4381 part, extracted from the
# device's own vendor image. The DRIVERS are built from source by
# linux-sol-modules (nitrous + synadhd4381); only the firmware is a prebuilt,
# because firmware is ABI-independent while stock's kernel modules are not
# (~half their symbol CRCs differ from ours and they need CFI symbols our kernel
# does not export).
IMAGE_INSTALL += "sol-connectivity-firmware"

# Lets USB reach low power mode when the cable is genuinely gone, which is the
# last thing standing between this watch and suspending: the extcon shim ships
# spoof_connected=1, so msm-dwc3 never goes idle and every suspend aborts with
# "USB is outside LPM". A permanent 0 is not the answer either -- the gadget
# never re-enumerates after a cable loss, and the dwc3 unbind that recovers it
# is only safe while the spoof is 1 -- so this follows the charger instead.
# Enabled: 101 deep suspend/resume cycles verified on hardware, uptime
# continuous, and the watch wakes when the cable returns.
IMAGE_INSTALL += "sol-usb-lpm"

# Pins the BT UART awake only while Bluetooth is wanted on. sol's device tree
# gives that UART no wakeup interrupt (the driver needs a second one and there
# is only one), so a runtime-suspended port can never be woken by the controller
# and Bluetooth needs it pinned -- but a pinned port holds a wakeup source, and
# one held wakeup source stops the kernel attempting suspend at all. Following
# the adapter means Bluetooth off buys sleep, Bluetooth on keeps working.
IMAGE_INSTALL += "sol-bt-uart-pm"

# Gives wlan0 the factory MAC from the device tree. Without it the driver hands
# out a fresh Broadcom test-OUI address on almost every load, and connman keys
# its saved networks on the interface MAC -- so WiFi silently stops
# auto-connecting after a reboot, which is both a daily-driver bug and the loss
# of the one channel that survives USB going away.
IMAGE_INSTALL += "sol-wlan-mac"

# Corrects the panel's advertised brightness ceiling before mce reads it. The
# panel packs normal brightness into the low 16 bits and AOD into the high 16, so
# its 0xFF01FF max is not linear -- scaling a percentage against it puts most of
# the value in the AOD field, which is why brightness did not follow the setting
# and why raising it past half made the screen dimmer.
IMAGE_INSTALL += "sol-panel-brightness"



# Brings up the modem subsystem, where the GNSS engine lives -- nothing binds or
# starts it at boot, so geoclue's provider waits forever for an engine that is not
# running. Installed but NOT enabled: positioning against this modem used to reset
# the SoC 3 times out of 3, and while that no longer reproduces (114 polled calls
# over ~19 minutes, the exact condition, no reset), what fixed it was never
# isolated. Enable by hand to test GPS.
IMAGE_INSTALL += "sol-modem-boot"



