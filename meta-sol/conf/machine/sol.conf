#@TYPE: Machine
#@NAME: Google Pixel Watch 3
#@DESCRIPTION: Machine configuration for the Pixel Watch 3 (sol/solios)

# armv7 userspace for hybris compatibility (kernel is aarch64).
require conf/machine/include/arm/armv7a/tune-cortexa7.inc
DEFAULTTUNE = "armv7vehf-neon"
require conf/machine/include/hybris-watch.inc

# Android side runs as a Halium LXC container; drop meta-asteroid's android-init
# and meta-android's android-system (we ship our own LXC bundle).
IMAGE_INSTALL:remove = "android-init android-system"

MACHINE_HAS_WLAN = "true"
MACHINE_HAS_SPEAKER = "true"
MACHINE_DISPLAY_ROUND = "true"

# Same values as aurora (A11 halium headers, android armv7+pie64), although the
# stock container is A14 (AW2A.240903).
PREFERRED_PROVIDER_virtual/android-system-image = "android"
PREFERRED_VERSION_android = "armv7+pie64"
PREFERRED_PROVIDER_virtual/android-headers = "android-headers-halium"
PREFERRED_VERSION_android-headers-halium = "11.0"

# aarch64 kernel from google-eos halium-13.0 (same tree and SoC as aurora),
# armv7 userspace. Keep PREFERRED_VERSION in sync with SOL_KERNEL_VERSION in
# recipes-kernel/linux/linux-sol-version.inc.
TUNE_PKGARCH:pn-linux-sol = "aarch64"
PREFERRED_PROVIDER_virtual/kernel = "linux-sol"
PREFERRED_VERSION_linux-sol = "5.15.148+git%"

# Modern kernels use configfs rather than functionfs.
PREFERRED_PROVIDER_android-tools-conf = "android-tools-conf-configfs"

# hw support packages (same set aurora ships; monaco SoC identical).
IMAGE_INSTALL += "sensorfw-hybris-binder-plugins udev-droid-system swclock-offset asteroid-hrm asteroid-compass"
# Bluetooth works as on aurora: the vendor HAL
# (android.hardware.bluetooth-service.pixel_watch, AIDL, bluebinder >= 1.0.20)
# runs in the container and bluebinder proxies it to /dev/vhci. The HAL loads the
# BCM4381A1 firmware and enables nitrous LPM, so the chip wakes the host on
# bt_host_wake and the UART can sleep. Needs CONFIG_BT=y and CONFIG_RFKILL=y
# (sw5100.fragment), or bluebinder sits in bluebinder_wait.sh forever and, being
# Restart=always, keeps multi-user.target from activating.
IMAGE_INSTALL += "bluebinder"
# Switching Bluetooth off and on leaves the watch invisible (0x42 Unknown
# Advertising Identifier on power-on, the advertising set is never re-created);
# re-register the advertisement each time. Same fault and workaround on aurora.
IMAGE_INSTALL += "sol-bt-adv-rearm"

# mce can hold its mce_display_on wakelock with the display off, so the kernel
# never arms autosleep and the watch drains (~72 mA). sol-sleep-guard detects
# that state and nudges mce; it ignores suspend that is attempted and aborted,
# which is a wakeup-source problem. mce is shared code, so the recovery lives here.
IMAGE_INSTALL += "sol-sleep-guard"

# The Broadcom WLAN gets its suspend power-save mode (extended DTIM, packet
# filters) once per display-off, as on Wear OS. See sol-wlan-suspendmode.
IMAGE_INSTALL += "sol-wlan-suspendmode"

# After an abnormal container restart the HIDL sensors HAL can stay
# unregistered; sensorfw's finishConnect() then blocks in sleep(), its D-Bus
# goes deaf, mce's plugin loads hit the pending-reply cap and the power key no
# longer wakes the screen. sol-sensors-guard re-runs the container bring-up only
# when sensorfw is wedged. Stop sol-sensors-guard.timer before debugging the
# container by hand, or it will restart it.
IMAGE_INSTALL += "sol-sensors-guard"

# A/B: the bootloader decrements the slot's tries-remaining every boot and drops
# to fastboot at zero. AOSP's update_verifier marks the slot successful on
# sys.boot_completed, which AsteroidOS never sets, so this does it instead.
IMAGE_INSTALL += "sol-mark-boot-successful"


# regulatory db for cfg80211 (qcacld reads /lib/firmware/regulatory.db at init).
IMAGE_INSTALL += "wireless-regdb-static"

# /vendor is a logical partition inside /super (mmcblk0p80, active slot _a).
# sol-vendor-mount recreates the dm-linear mappings and mounts them so Halium
# HAL services resolve /vendor/bin/hw/*.
IMAGE_INSTALL += "sol-vendor-mount"

# Halium Android system image and the LXC container. Required: stock A14 bionic
# faults before main() under libhybris (see sol-vendor-mount.sh).
IMAGE_INSTALL += "sol-lxc-android"
IMAGE_INSTALL += "lxc"

# Ship out-of-tree vendor modules to the rootfs /lib/modules/${KREL}/vendor.
IMAGE_INSTALL += "linux-sol-modules"

# Post-rootfs auto-load of WLAN/ASoC/BT modules after pivot_root.
IMAGE_INSTALL += "sol-modules-autoload"

# Clear the qcom-lpm governor's sleep_disabled boot default so cluster/system
# low-power modes engage (the ~27 mA suspend-floor fix).
IMAGE_INSTALL += "sol-lpm-enable"

# No gralloc shim recipe: the Halium system ships libui_compat_layer.so in
# /system/lib, so libhybris takes its gralloc4 path as is.

# Persistent journal from the first entry (see the recipe for why this is
# standalone and not a systemd bbappend).
IMAGE_INSTALL += "sol-journal-config"

# Audio plays through module-droid-card (droid-merhybris, droid-hidl, same as
# aurora) once the ADSP is reachable over QRTR. These tools are for probing the
# mixer. Speaker routing needs four controls, from
# /vendor/etc/audio/sku_monaco/mixer_paths_monaco_idp_google.xml:
#     RX_MACRO RX0 MUX     = AIF1_PB
#     RX INT2_1 MIX1 INP0  = RX0
#     SWR DAC_Port Switch  = 1
#     VISENSE Switch       = 1
IMAGE_INSTALL += "alsa-utils-amixer alsa-utils-aplay alsa-utils-alsactl alsa-utils-speaker-test"

# The policy configuration module-droid-card is pointed at, filtered out of the
# vendor image's own at boot. See the recipe for what has to be removed and why.
IMAGE_INSTALL += "sol-audio-policy"

# Location. geoclue is in no packagegroup; the binder provider comes with it via
# the geoclue bbappend. sol-location carries the settings that let the provider
# reach sol's AIDL GNSS HAL.
IMAGE_INSTALL += "geoclue sol-location"

# adb after switch_root. usb-moded's udev cable watch dies on sol ("udev io
# watch disabled"), so adb_mode is never applied. sol-bringup-adb masks
# usb-moded and binds the gadget itself. Remove once usb-moded is fixed.
IMAGE_INSTALL += "sol-bringup-adb"

# sol has no modem (kernel prints modem_supported=0x0). Unbind the modem
# remoteproc at boot so nothing can start it; adsp shares the driver and keeps
# working. Whether the SoC reset also needs this unbind was never tested, so
# removing it is not a cleanup.
IMAGE_INSTALL += "sol-no-modem"

# The AIDL hwc2 compat layer the launcher needs to see sol's composer3 HAL.
# Overlaid into the Halium system image at runtime; see the recipe for why it
# cannot simply be installed into that path.
IMAGE_INSTALL += "sol-hwc2-aidl"

# Brings up the ADSP, where the USF sensor sub-HAL runs. Without it remoteproc0
# stays offline and no sensor can ever enumerate.
IMAGE_INSTALL += "sol-adsp-boot"

# HIDL sensors front-end + its VINTF fragment. sol's vendor ships only the AIDL
# sensors service; sensorfw is a HIDL client, so without this it sees no sensors
# at all. See the recipe for why swapping only the front-end is safe.
IMAGE_INSTALL += "sol-sensors-hidl"

# Keeps nanohub's shared 20-buffer pool from being stranded by channels nothing
# reads. ~20 unread messages on any one of brightness/display/render/debug_log/
# metrics/console/pele stall the driver's reader kthread and every sensor dies.
IMAGE_INSTALL += "sol-nanohub-drain"

# CS40L26A LRA haptics on i2c 0x43. Loaded after sol-adsp-boot because the
# driver uses synchronous request_firmware() and its firmware is in the vendor
# image. The driver exposes FF_PERIODIC/FF_CUSTOM only (no FF_RUMBLE).
IMAGE_INSTALL += "sol-haptics"

# WiFi/BT firmware for the BCM4381, extracted from the vendor image. The drivers
# (nitrous, synadhd4381) are built from source by linux-sol-modules; stock's
# modules do not load on our kernel (symbol CRCs and CFI symbols differ).
IMAGE_INSTALL += "sol-connectivity-firmware"

# The extcon shim ships spoof_connected=1, so msm-dwc3 never idles and every
# suspend aborts with "USB is outside LPM". A permanent 0 breaks re-enumeration
# after a cable loss, and the dwc3 unbind that recovers it is only safe with the
# spoof at 1, so this follows the charger instead.
IMAGE_INSTALL += "sol-usb-lpm"

# Gives wlan0 the factory MAC from the device tree. Otherwise the driver picks a
# random Broadcom test-OUI address per load, and connman, which keys saved
# networks on the MAC, stops auto-connecting after a reboot.
IMAGE_INSTALL += "sol-wlan-mac"

# Corrects the panel's advertised brightness ceiling before mce reads it. The
# panel packs normal brightness into the low 16 bits and AOD into the high 16,
# so its 0xFF01FF max is not linear and mce's scaling lands in the AOD field.
IMAGE_INSTALL += "sol-panel-brightness"



# Brings up the modem subsystem, where the GNSS engine lives; nothing starts it
# at boot. Installed but not enabled: positioning against it used to reset the
# SoC, and while that no longer reproduces, the fix was never isolated. Enable
# by hand to test GPS.
IMAGE_INSTALL += "sol-modem-boot"



