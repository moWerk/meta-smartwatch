# Modules whose .ko files are on the rootfs (/lib/modules/<KREL>/vendor/), so
# the initramfs modules.load.sol cannot load them. systemd-modules-load runs
# this after the rootfs is mounted; modprobe resolves dependencies, so order is
# informational.

# --- MCU management UART ---
# The sensor hub uses SPI (nanohub, firmware download) and a UART (events).
# Without this module there is no /dev/ttyHS1, mcu_mgmtd exits, nothing listens
# on /dev/socket/mcu_event, and the whole sensor stack is empty.
msm_geni_serial

# --- SPI controller: the sensor hub hangs off it ---
# Without it there is no SPI bus: nanohub (spi1.0, sensorhub@0) has nothing to
# bind, /sys/class/nanohub is missing and mcu_mgmtd aborts with "failed to read
# firmware name." spi0.0 is the NFC part (nxp,srxxx).
#
# spi-msm-geni, not spi-geni-qcom: the Qualcomm downstream driver matches sol's
# qupv3 nodes.
spi-msm-geni

# --- Side button (PMIC power-on key) ---
# The side button is not a gpio-key (gpio_keys only has vol_up). It is
# qpnp-power-on's pon_hlos@1300, which stock loads from second-stage init and
# AsteroidOS never ran. Registers qpnp_pon with KEY_POWER. Loaded here rather
# than in modules.load.sol because the .ko is on the rootfs and the key is only
# useful once mce runs.
#
# The container's vendor_dlkm copies of this and every other module are refused
# by this kernel (vermagic 5.15.148-android14-11-g<sha> vs plain 5.15.148).
qpnp-power-on

# --- Touch digitizer (Novatek NT383x0) ---
# On the rootfs, not in the initramfs. Registers "NVTCapacitiveTouchScreen"
# with INPUT_PROP_DIRECT and pulls in nanohub and panel_event_notifier.
touch_nt383x0

# --- WLAN + Bluetooth (Synaptics/Broadcom BCM4381) ---
# sol has no Qualcomm WLAN/BT, unlike aurora. Its BCM4381 combo shows as
# /soc/wlan-gpios "android,syna_wlan" and /soc/btbcm "goog,nitrous" in the DT;
# stock's init.insmod.sol.cfg loads synadhd4381.ko. Both drivers are built by
# linux-sol-modules; firmware comes from sol-connectivity-firmware in
# /lib/firmware.
#
# rfkill and btbcm are built in (CONFIG_RFKILL=y, CONFIG_BT_BCM=y): as modules
# GKI rejects rfkill with "exports protected symbol rfkill_alloc".
synadhd4381
nitrous

# --- QRTR transport to the ADSP ---
# qrtr.ko loads from the initramfs, but its SMD/glink transport does not (stock
# loads qrtr-smd from vendor_dlkm, whose modules this kernel refuses). Without
# it glink-edge.IPCRTR is unbound and QRTR has no endpoint: the audio notifier
# chain never sees the ADSP audio service, card_state stays 0, AGM fails
# gsl_init with -131 and respawns every 3 s, and IAGM is never registered.
#
# Must load before sol-adsp-boot.service. Loading it with the ADSP already
# running resets the SoC within ~300 ms. Never modprobe it by hand.
qrtr-smd

# --- ASoC machine driver + codecs ---
# machine_dlkm is monaco-asoc-snd and pulls bolero/wcd/macros/swr via deps; the
# key ones are listed so a stale modules.dep does not bite.
#
# No wsa883x_dlkm: sol has no WSA883x amp (absent from its device trees); its
# codec is besbev. The CS40L26A on i2c 0x43 is the haptic driver, loaded by
# sol-haptics because it needs the firmware path sol-adsp-boot sets.
machine_dlkm
stub_dlkm
bolero_cdc_dlkm
besbev_dlkm
besbev-slave_dlkm
wcd9xxx_dlkm
wcd_core_dlkm
rx_macro_dlkm
tx_macro_dlkm
va_macro_dlkm
swr_dlkm
swr_ctrl_dlkm
pinctrl_lpi_dlkm
pmw5100-spmi_dlkm
cc_dlkm
audio_cc_ipc_dlkm

# bt_fm_slim and btpower serve the Qualcomm BT path sol does not have.

# --- BT vHCI (host-side virtual HCI for bluebinder) ---
hci_vhci

# --- Qualcomm cpuidle governor: cluster/system low-power modes ---
# Without it the kernel idles on `menu`, cluster-pd0 never power-collapses and
# the suspended floor sits around 27 mA.
#
# The governor also hard-codes `sleep_disabled = true`
# (drivers/cpuidle/governors/qcom-lpm.c), which stock userspace clears after
# boot. sol-lpm-enable.service writes 0 to
# /sys/devices/system/cpu/qcom_lpm/parameters/sleep_disabled. The stock
# cmdline flag lpm_levels.sleep_disabled=1 is inert on 5.15.
qcom_lpm

# --- AP sleep-state signal to the always-on subsystem ---
# Publishes the AP's sleep state over SMP2P to remote subsystems (ADSP, AOSS),
# part of what AOSS checks before VLOW/VMIN. Stock loads it from vendor_dlkm.
smp2p_sleepstate

# --- Sleep-state observability (debugfs qcom_sleep_stats) ---
# Per-subsystem sleep counters (apss/adsp/vmin/vlow). No functional effect, but
# the only way to tell "suspended" from "reached a deep chip state".
soc_sleep_stats
subsystem_sleep_stats

# --- Let the GCC clock controller reach sync_state ---
# Binds the Venus video node (msm_video is not built for sol). Unbound, gcc
# never syncs and every clock the bootloader left on (USB, eMMC, QUP, gpll0)
# stays on through suspend. Listed here as well as matched by modalias so it
# does not depend on udev coldplug order.
sol_vidc_stub

# --- Let the interconnect providers reach sync_state ---
# The crypto engine and hardware RNG consume three interconnect providers
# (1880000, 1900000, 4480000). Unbound, the providers never run sync_state and
# keep their boot-time bandwidth votes. Stock loads both.
qrng_dlkm
qcrypto-msm_dlkm
