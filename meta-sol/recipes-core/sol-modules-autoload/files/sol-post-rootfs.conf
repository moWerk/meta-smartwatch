# Modules whose .ko files live on the rootfs (/lib/modules/<KREL>/vendor/)
# and therefore cannot be loaded from the VKB initramfs modules.load.sol.
# Systemd's systemd-modules-load.service walks this file at boot, after the
# rootfs is mounted -- modprobe then resolves dependencies from modules.dep.
# Order is informational; modprobe handles dep resolution.

# --- MCU management UART ---
# The sensor hub talks over TWO links: SPI (nanohub, firmware download) and a
# UART (management/event channel). ro.vendor.mcu.uart.dev.path is /dev/ttyHS1,
# and without this module no ttyHS* node exists at all -- so /vendor/bin/mcu_mgmtd
# opened it, got ENOENT, and exit_group(-1)'d. Android init restarted it every
# ~6 seconds forever, which meant nothing ever listen()ed on /dev/socket/mcu_event,
# so USF logged "Unable to establish MCU event connection, Errno = 111", the
# sensors multihal enumerated nothing, and sensorfw reported handle -1. One
# missing module, the entire sensor stack dead.
#
# Found by strace: exactly one failed syscall in the whole trace.
#   openat("/dev/ttyHS1", O_RDWR|O_NONBLOCK|O_LARGEFILE) = -1 ENOENT
# aurora (working reference) has ttyHS0+ttyHS1 with msm_geni_serial loaded.
#
# Verified on hardware 2026-08-15, no reset: brings up ttyHS0 (4a94000 qup_uart)
# and ttyHS1 (4a9c000 qup_uart_b); mcu_mgmtd then stays up with ttyHS1 as fd 8,
# and the nanohub firmware re-download loop stops.
msm_geni_serial

# --- SPI controller: the sensor hub hangs off it ---
# Without this there is no SPI bus at all on sol: /sys/class/spi_master/ empty,
# zero spi devices. nanohub registers as an SPI driver (spi:nanohub) and so had
# nothing to bind to, which is why /sys/class/nanohub never existed and
# /vendor/bin/mcu_mgmtd aborted at startup with "failed to read firmware name."
# -- it reads the name from nanohub_comms/firmware_name.
#
# Loading it brings up spi0/spi1 and both slaves:
#   spi0.0 = spi@4a8c000/srxxx@0     compatible nxp,srxxx   (NFC)
#   spi1.0 = spi@4a90000/sensorhub@0 compatible nanohub     (the MCU)
# nanohub then binds, /sys/class/nanohub appears, firmware_name reads
# mcu_luna_evt1_5.bin, and the MCU firmware downloads (err=0). mcu_mgmtd, chre
# and the sensors multihal all come up. Verified on hardware 2026-08-15; no
# reset, boot_id unchanged across the modprobe.
#
# spi-msm-geni, not spi-geni-qcom: both ship, this is the Qualcomm downstream
# driver that matches sol's qupv3 nodes.
spi-msm-geni

# --- Side button (PMIC power-on key) ---
# sol's side button is NOT a gpio-key. Our gpio_keys node has exactly one child
# (vol_up, KEY_VOLUMEUP, code 115), which is why mce saw nothing when the button
# was pressed and the watch could not be woken from AoD. Stock's own dmesg
# (archive: sol-port-artifacts/sol-stock-dmesg.txt) shows the real one:
#     qcom,qpnp-power-on 1c40000.qcom,spmi:qcom,pm5100@0:pon_hlos@1300
#     input: qpnp_pon as .../pon_hlos@1300/input/input1
# It registers at ~9.3s on stock, i.e. from SECOND-STAGE init -- and AsteroidOS
# stays in the initramfs and never runs a second stage, so nothing ever loaded
# it. The driver was built and shipped all along; it was simply never modprobed,
# the same omission as touch_nt383x0 above.
#
# Here rather than in modules.load.sol on purpose: the .ko is on the rootfs at
# kernel/drivers/input/misc/qpnp-power-on.ko, so this needs no vkb rebuild and
# no flash, and the key is only useful once mce is up anyway.
#
# Verified by hand 2026-08-15: modprobe reproduces stock's lines exactly,
# including stock's own "IRQ pmic-wd-bark not found" warning, and registers
# qpnp_pon with KEY=140000 -> bits 116 (KEY_POWER) and 114. Two new interrupts
# appear, pon_kpdpwr_status and pon_resin_status.
#
# Ignore the copies in the container image (/android/vendor_dlkm/lib/modules and
# the container rootfs): those produce "disagrees about version of symbol
# module_layout" because every vendor_dlkm module is built for vermagic
# 5.15.148-android14-11-g<sha> while ours is plain 5.15.148.
qpnp-power-on

# --- Touch digitizer (Novatek NT383x0) ---
# Nothing loaded this before 2026-08-15: it is absent from modules.load.sol,
# absent from here, and not blacklisted, so the watch booted with exactly one
# input device (gpio-keys) and no touchscreen at all -- a visible launcher that
# could not be used. The .ko is built by linux-sol-modules and lives on the
# rootfs at /lib/modules/${KREL}/vendor/touch_nt383x0.ko, so here is where it
# belongs rather than in the VKB ramdisk list.
#
# Do NOT be tempted by the copy in the container's vendor_dlkm: every module in
# that image is refused by our kernel with "Invalid module format", because its
# vermagic is 5.15.148-android14-11-g<sha> while ours is plain 5.15.148.
#
# Probes clean and registers "NVTCapacitiveTouchScreen" with INPUT_PROP_DIRECT;
# pulls nanohub and panel_event_notifier in by dependency.
touch_nt383x0

# --- WLAN + Bluetooth (Synaptics/Broadcom BCM4381) ---
# CORRECTED 2026-08-16. This block used to list the Qualcomm set (wlan, icnss2,
# cnss_nl, cnss_plat_ipc_qmi_svc, cnss_prealloc, cnss_utils, wlan_firmware_service,
# google_wlan_mac) copied from aurora. Those modules build fine and can NEVER
# bind here -- `modprobe wlan` returns ENODEV because sol has no Qualcomm WLAN.
# Likewise bt_fm_slim/btpower, which were listed below for the Qualcomm BT path.
#
# sol's part is a Synaptics/Broadcom BCM4381 combo, confirmed four ways: the DT
# node /soc/wlan-gpios is compatible "android,syna_wlan", /soc/btbcm is
# compatible "goog,nitrous", sol's own /vendor/etc/init.insmod.sol.cfg modprobes
# synadhd4381.ko, and the vendor firmware is BCM4381A1.hcd / fw_bcmdhd.bin.
#
# Both drivers are built from source by linux-sol-modules
# (google-modules/bluetooth/broadcom -> nitrous, google-modules/wlan/syna/dhd4381
# -> synadhd4381). Firmware comes from sol-connectivity-firmware, installed into
# /lib/firmware where the kernel's default search path finds it.
#
# rfkill and btbcm are NOT listed: they are upstream in-tree and are built in via
# CONFIG_RFKILL=y / CONFIG_BT_BCM=y (they have to be built in -- as modules the
# GKI protected-symbol rule rejects rfkill outright with
# "rfkill: exports protected symbol rfkill_alloc").
synadhd4381
nitrous

# --- QRTR transport to the ADSP ---
# qrtr.ko comes up from the VKB initramfs, but the SMD/glink transport that
# carries QRTR traffic to the ADSP does not: stock sol loads qrtr-smd from
# vendor_dlkm, an image whose modules this kernel refuses (vermagic
# 5.15.148-android14-11-g<sha> vs our plain 5.15.148). Nothing bound
# glink-edge.IPCRTR, so QRTR had a bus and no endpoint.
#
# The whole AudioReach path hangs off it, on both sides of the kernel boundary.
# In-kernel, the audio notifier chain q6_notifier_dlkm -> q6_pdr_dlkm ->
# pdr_interface -> qmi_helpers -> qrtr never sees the ADSP audio service
# register, so the monaco card stays offline and /sys/kernel/snd_card/card_state
# reads 0. In userspace, AGM's ar_osal_servreg_register cannot reach the
# servreg_notif QMI service; gsl_init then fails with -131 and AGM exits(1) in a
# 3-second respawn loop, so vendor.qti.hardware.AGMIPC@1.0::IAGM -- the service
# PulseAudio's in-process HAL blocks on -- is never registered.
#
# Load it here, before sol-adsp-boot.service. Loading it once the ADSP is
# already running resets the SoC within ~300ms, traceless, no pstore and no
# kernel words: 2/2 attempts 2026-08-17. Never modprobe this by hand.
#
# Verified on hardware 2026-08-17: card_state=1, IPCRTR bound to qcom_smd_qrtr,
# AGM holding a binder fd with IAGM in lshal.
qrtr-smd

# --- ASoC machine driver + codecs ---
# machine_dlkm is monaco-asoc-snd. Pulls bolero/wcd/macros/swr via deps.
# We list a few key ones explicitly so a stale modules.dep does not bite.
#
# wsa883x_dlkm REMOVED 2026-08-16. sol has NO WSA883x speaker amp: `wsa883x`
# appears ZERO times in all three of sol's decompiled device trees (base.dts,
# shipped.dts, merged.dts), while `besbev` -- the codec it actually has --
# appears 11 times in each. The entry was inherited from aurora and is the same
# class of dead weight as the Qualcomm WLAN set already removed from this file
# (modules that build fine and can never bind).
#
# For the record, sol's amplifier-shaped part IS the Cirrus CS40L26A on i2c
# 0x43, and that is the HAPTIC LRA driver, not a speaker amp -- see
# meta-sol/recipes-bsp/sol-haptics. It is loaded there, deliberately not here,
# because it needs the firmware search path that sol-adsp-boot sets and
# systemd-modules-load runs far too early for that.
machine_dlkm
stub_dlkm
bolero_cdc_dlkm
besbev_dlkm
besbev-slave_dlkm
wcd9xxx_dlkm
wcd_core_dlkm
rx_macro_dlkm
tx_macro_dlkm
va_macro_dlkm
swr_dlkm
swr_ctrl_dlkm
pinctrl_lpi_dlkm
pmw5100-spmi_dlkm
cc_dlkm
audio_cc_ipc_dlkm

# NOTE: bt_fm_slim and btpower (Qualcomm BT slimbus/power) were listed here and
# are removed -- they serve the Qualcomm BT path this watch does not have. If the
# ASoC machine driver ever wants btfmslim_slave for a WCN dai_link, revisit, but
# sol's BT audio goes through the Broadcom part.

# --- BT vHCI (host-side virtual HCI for bluebinder) ---
hci_vhci

# --- Qualcomm cpuidle governor: cluster/system low-power modes ---
# THE sleep-drain module. Without it the kernel idles on the generic `menu`
# governor, which knows nothing about SoC low-power modes: cluster-pd0 never
# power-collapses (Usage=0 against 282124 rejections on sol, 7.28M on a
# 2.8-day aurora uptime) and the SoC floor sits at ~27 mA asleep, because the
# chip can only reach shallow retention.
#
# Loading it is HALF the fix. The governor hard-codes
# `bool sleep_disabled = true;` (drivers/cpuidle/governors/qcom-lpm.c) --
# Qualcomm's boot-stability default, which stock userspace clears after boot.
# sol-lpm-enable.service writes 0 to
# /sys/devices/system/cpu/qcom_lpm/parameters/sleep_disabled once modules are
# loaded. (The legacy cmdline flag `lpm_levels.sleep_disabled=1` that stock's
# vendor_boot carries is inert on 5.15 -- the governor reads no module param,
# only the sysfs default matters.)
#
# Verified on hardware 2026-08-24 on both watches: with the module loaded and
# the flag cleared, cluster-pd0 went 0 -> 135 collapses in 240 s (sol,
# port-cut) and 0 -> 1441 in 45 s (aurora, live), and APSS power-collapse
# count rose above the suspend count for the first time.
qcom_lpm

# --- AP sleep-state signal to the always-on subsystem ---
# Publishes the AP's sleep/wake state over SMP2P so remote subsystems (ADSP,
# AOSS) know when the AP is down. Stock loads it from vendor_dlkm; ours never
# loaded it anywhere. Binds three smp2p instances on sol. Part of the chain
# AOSS consults before dropping to the deeper chip states (VLOW/VMIN).
smp2p_sleepstate

# --- Sleep-state observability (debugfs qcom_sleep_stats) ---
# Expose per-subsystem sleep counters (apss/adsp/vmin/vlow) in
# /sys/kernel/debug/qcom_sleep_stats/. No functional effect; these are the
# only instrument that distinguishes "suspended" from "actually reached a
# deep chip state", which is what the whole 27 mA hunt ran on. Cheap, keep.
soc_sleep_stats
subsystem_sleep_stats
