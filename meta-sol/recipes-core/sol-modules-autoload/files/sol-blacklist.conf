# Keep the Venus video codec (msm_video) out of the kernel.
#
# udev autoloads it by modalias for 5a00000.qcom,vidc. Its firmware lives in
# the vendor image, so it fails:
#   msm_vidc_v4l2 5a00000.qcom,vidc: Direct firmware load for venus_v6.mbn failed with error -2
# but still registers a V4L2 node. udev's v4l_id then blocks in the driver
# forever, which stalls coldplug and sysinit, and boot hangs at the splash:
#   rcu: INFO: rcu_preempt detected stalls on CPUs/tasks:
#   task:v4l_id  state:R  running task  stack:11488 pid:853 ppid:1
#
# `install ... /bin/false` as well, because blacklist alone does not stop a
# modalias autoload. For hardware video decode, provide venus_v6.mbn from the
# vendor partition instead of removing this.
blacklist msm_video
install msm_video /bin/false
