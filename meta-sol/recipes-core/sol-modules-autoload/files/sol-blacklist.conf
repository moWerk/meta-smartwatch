# sol bring-up: keep the Venus video codec out of the kernel.
#
# THIS IS WHAT HUNG THE FIRST USERLAND BOOTS. Root-caused 2026-08-09 from a
# journal-to-kmsg capture pulled out of logdump:
#
#   rcu: INFO: rcu_preempt detected stalls on CPUs/tasks:
#     2-...0: (1 GPs behind) ... fqs=619663
#     (detected by 0, t=619697 jiffies, g=2121, q=16658)
#   Task dump for CPU 2:
#   task:v4l_id  state:R  running task  stack:11488 pid:853 ppid:1
#
# Sequence: nothing of ours loads msm_video -- udev auto-loads it by modalias
# when the 5a00000.qcom,vidc platform device appears. The driver then cannot
# initialise, because the Venus firmware lives in the Android vendor partition
# we do not mount:
#   msm_vidc_v4l2 5a00000.qcom,vidc: Direct firmware load for venus_v6.mbn failed with error -2
#   msm_vidc: err: codec: __load_fw: firmware download failed -2
# It still registers a V4L2 node, so udev runs v4l_id against it, and v4l_id
# blocks in the driver forever. That wedges udev's coldplug, which blocks
# sysinit, which blocks everything downstream -- usb-moded, adbd, the lot. The
# watch sat at the splash for 43 minutes (uptime 2600s+) with no reboot: not a
# crash, a hang.
#
# `install ... /bin/false` as well as `blacklist`: blacklist alone does not stop
# udev's modalias-driven autoload, only manual/dependency loads.
#
# BRING-UP ONLY. When hardware video decode is wanted, the fix is to provide
# venus_v6.mbn from the vendor partition (see sol-vendor-mount) -- not to
# re-enable this blind.
blacklist msm_video
install msm_video /bin/false
