# Persist the journal and mirror it into the kernel ring buffer.
#
# Storage=persistent: the default "auto" keeps everything after the flush in
# /run, out of reach from the initramfs hold window.
#
# ForwardToKMsg=yes + MaxLevelKMsg=debug: `dmesg` read from the initramfs hold
# window shows userland progress that journalctl cannot, since the active
# journal file is treated as unclean. The last ~30 s before an abrupt reset
# never reach the disk either way, and sol's logdump partition is a static
# snapshot, not a live ring.
#
# Bring-up aid: kmsg forwarding is noisy and persistent journals cost flash
# writes. Revisit before release.
[Journal]
Storage=persistent
SystemMaxUse=16M
ForwardToKMsg=yes
MaxLevelKMsg=debug
