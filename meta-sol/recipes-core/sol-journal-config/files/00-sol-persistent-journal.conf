# sol bring-up: persist the journal AND mirror it into the kernel ring buffer.
#
# Storage=persistent
#   Default "auto" buffers to /run until "Flush Journal to Persistent Storage"
#   runs, so anything after that point lives only in the booted system's tmpfs
#   -- unreachable from the initramfs hold window.
#
# ForwardToKMsg=yes + MaxLevelKMsg=debug
#   This is the load-bearing one. On 2026-08-09 the userland boot stalled in
#   sysinit (several units "Starting ..." with no matching Finished) and we
#   could not see past it: journald rotates at SystemMaxFileSize (2M here) and
#   the continuation sits in an actively-written file that journalctl treats as
#   unclean, so pulling it off the rootfs yields almost nothing.
#   Forwarding to kmsg puts every entry in the kernel ring buffer, which is
#   still worth having: `dmesg` read live from the initramfs hold window shows
#   userland progress that journalctl cannot.
#
#   CORRECTED 2026-08-10: an earlier version of this comment claimed seluna
#   flushes kmsg to the logdump partition on reset, making it a persistent
#   channel readable via `adb exec-out dd if=/dev/mmcblk0p2`. That is NOT true
#   on this device. logdump was pulled twice across a reset and the two 8 MB
#   images are byte-identical, both ending mid-log at 60.99 s -- it is a stale
#   static snapshot, not a live ring, and a reset leaves no trace in it.
#   Note also that journald does not capture the final seconds before an abrupt
#   reset even with Storage=persistent: the last ~30 s never reach the disk.
#
# BRING-UP AID. Revisit before release: kmsg forwarding is noisy and costs
# ring-buffer space, and persistent journals cost flash writes on a watch.
[Journal]
Storage=persistent
SystemMaxUse=16M
ForwardToKMsg=yes
MaxLevelKMsg=debug
