[Unit]
# Make sure the FunctionFS mount at /dev/usb-ffs/adb is in place whenever
# android-tools-adbd starts, whoever starts it.
Wants=adbd-prepare.service
After=adbd-prepare.service

[Service]
# sol's gadget is g1 from init_gfs.service, with ffs.adb. The upstream
# 10-adbd-configfs.conf drop-in would create a second "adb" gadget and bind the
# UDC to it. Empty values clear its ExecStartPre/Post/StopPost.
ExecStartPre=
ExecStartPost=
ExecStopPost=

# journald does not ingest this service's output on sol; keep adbd's ep0 and
# descriptor errors in /var/log.
StandardOutput=append:/var/log/android-tools-adbd.log
StandardError=append:/var/log/android-tools-adbd.log
