# sol compositor environment. Replaces meta-asteroid's generic default, which
# is eglfs/eglfs_kms -- wrong for a libhybris device and the source of the
# "qt.qpa.egldeviceintegration: Failed to load EGL device integration
# eglfs_kms" line that accompanied every launcher crash on sol.

# Use the Android compositor path, not the generic KMS one.
#
# Without EGL_PLATFORM set, libhybris falls back to its compiled-in default of
# `wayland` -- the CLIENT-side platform -- and asteroid-launcher is the
# compositor, not a client. That crashed inside eglInitialize with a NULL
# wayland proxy:
#     #0 wl_proxy_get_version ()     libwayland-client.so.0
#     #1 waylandws_eglInitialized () libhybris/eglplatform_wayland.so
#     #2 eglInitialize ()            libEGL.so.1
# Confirmed on hardware 2026-08-10.
EGL_PLATFORM=hwcomposer
QT_QPA_PLATFORM=hwcomposer

QT_IM_MODULE=qtvirtualkeyboard

# RESOLVED 2026-08-15. The note that used to sit here said sol exposed only
# "gpio-keys" on event0 and that the nt383x0 driver "does not register an input
# device yet". The driver was fine; nothing ever loaded it. touch_nt383x0.ko is
# built by linux-sol-modules and sits on the rootfs, but it was listed neither
# in modules.load.sol nor in modules-load.d, so it was never modprobed. Loading
# it by hand probes clean ("request irq 184 succeed", "nvt finished") and
# registers "NVTCapacitiveTouchScreen" with INPUT_PROP_DIRECT. It is now loaded
# at boot from sol-post-rootfs.conf.
#
# Aimed at the udev symlink, not at an event number: gpio-keys is built in and
# always takes event0, but the digitizer's number depends on module load order
# against every other input-registering driver, and aurora lands on event2 where
# sol currently lands on event1. See 70-sol-touchscreen.rules.
LIPSTICK_OPTIONS="-plugin evdevtouch:/dev/input/touchscreen"

# libhybris's Android library search path, set here rather than relying on the
# compiled-in default, following aurora.
#
# POINT THIS AT THE HOST'S OWN A13 TREE, NEVER AT THE CONTAINER'S.
#
# These are two DIFFERENT Android systems and mixing them in one process does
# not fail cleanly. This path used to lead with
# /var/lib/lxc/android/rootfs/system/lib, which was harmless only while the
# container image happened to be aurora's A13 one. Once the container became
# A14, the launcher loaded A14 libraries here and A13 ones through /system
# (a symlink to /android/hybris/system, set by sol-vendor-mount), and died
# before EGL with:
#     cannot locate symbol
#       _ZN7android19GraphicBufferMapper4lockEPK13native_handlejRKNS_4RectEPPvPiS9_
#     dlsym failed: library handle is null
#     couldn't load system EGL wrapper libraries
# Pointing every entry at the A13 tree cleared that instantly: the launcher then
# loads its HAL modules ("== power module ==" and friends) and gets all the way
# to the composer. Measured on hardware 2026-08-12.
#
#   /android/hybris/system/lib
#       the Halium A13 system, mounted from hybris-system.img. sol's OWN stock
#       A14 /system does not work here: libhybris deliberately skips libc.so's
#       constructors, and stock A14 bionic then faults at NULL+0x410 before
#       main(). A Halium-built system is made to be loaded this way.
#   /vendor/lib, /vendor/lib/egl, /vendor/lib/hw
#       sol's own A14 vendor. The egl subdirectory is NOT optional: without it
#       the Adreno driver cannot find eglSubDriverAndroid.so. Vendor is shared
#       with the container by design; only /system must not be.
#   /usr/libexec/hal-droid/system/lib
#       empty on sol today, kept for parity and for anything installed there.
#   /android/hybris/system/lib/bootstrap  <- FIRST, and this matters
#       bionic itself. The A13 tree's /system/lib/{libc,libm,libdl}.so are
#       SYMLINKS into /apex/com.android.runtime/..., and the A13 tree has no
#       /apex of its own -- so they resolved against the HOST's /apex, which is
#       loop-mounted from the A14 CONTAINER image. That silently paired A13
#       libc++ with A14 bionic (1121056 bytes) instead of the A13 tree's own
#       bionic (865236). The launcher then segfaulted inside
#       std::__1::ctype_byname<char>::ctype_byname, i.e. C++ locale construction
#       crossing that boundary -- the same mixed-provenance shape as the earlier
#       GraphicBufferMapper failure.
#       The A13 tree ships real bionic at /system/lib/bootstrap/{libc,libdl,
#       libdl_android,libm}.so, so point at that and put it FIRST.
#       The previous entry here, /android/hybris/apex/com.android.runtime/lib/
#       bionic, does not exist at all -- which is why the fallthrough happened.
HYBRIS_LD_LIBRARY_PATH=/android/hybris/system/lib/bootstrap:/opt/sol-hwc2/lib:/android/hybris/system/lib:/vendor/lib:/vendor/lib/egl:/vendor/lib/hw:/usr/libexec/hal-droid/system/lib

# NOT set, deliberately: HYBRIS_HWC_DISABLE_COMPOSER_USAGE=1.
#
# An earlier version of this comment expected to need it once the -EINVAL
# symptom showed up. The symptom did show up on 2026-08-13
# (drmModeAtomicCommit failed with error 22, crtc 80, plane 70) and the fix
# has been taken -- but as a libhybris patch, not as this variable.
#
# The variable is inert. Neither aurora's libhybris-aurora-disable-ubwc-usage
# patch nor sol's regenerated copy of it reads HYBRIS_HWC_DISABLE_COMPOSER_USAGE
# anywhere, and no HYBRIS_HWC_* string exists in the libhybris actually built for
# either device. aurora sets it in its own default.conf and meta-aurora's
# bbappend describes the patch as gated on it, but the gating is really just the
# per-machine SRC_URI append. Setting it here would advertise a switch that does
# not exist, so sol does not set it. See meta-sol's libhybris bbappend.
