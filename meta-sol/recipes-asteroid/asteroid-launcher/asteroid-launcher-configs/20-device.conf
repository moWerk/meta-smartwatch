# sol's compositor drop-in, read after meta-asteroid's 00-default.conf and
# 10-platform.conf. A hybris machine already gets EGL_PLATFORM and
# QT_QPA_PLATFORM=hwcomposer plus QT_IM_MODULE from those, and the launcher unit
# loads the touchscreen itself, so only sol's library path lives here.

# No evdevtouch plugin here. asteroid-launcher.service already passes
# `-plugin evdevtouch`, which picks up every INPUT_PROP_DIRECT touchscreen. A
# second `-plugin evdevtouch:/dev/input/touchscreen` opens the digitizer twice:
# every touch point arrives doubled, flicks lose their velocity and edge swipes
# are not recognised.

# libhybris's Android library search path, following aurora.
#
# Point it at the host's Halium A13 tree, never at the A14 container's /system.
# Mixing the two in one process fails at symbol level, e.g.
#     cannot locate symbol
#       _ZN7android19GraphicBufferMapper4lockEPK13native_handlejRKNS_4RectEPPvPiS9_
#     couldn't load system EGL wrapper libraries
#
#   /android/hybris/system/lib/bootstrap  (must be first)
#       bionic. The A13 tree's /system/lib/{libc,libm,libdl}.so are symlinks
#       into /apex/com.android.runtime, which on the host is the A14 container's
#       /apex. That pairs A13 libc++ with A14 bionic and the launcher segfaults
#       in ctype_byname (C++ locale setup). bootstrap/ has the A13 tree's real
#       bionic.
#   /android/hybris/system/lib
#       the Halium A13 system from hybris-system.img. Stock A14 /system cannot
#       be used: libhybris skips libc.so's constructors and stock A14 bionic
#       faults before main().
#   /vendor/lib, /vendor/lib/egl, /vendor/lib/hw
#       sol's A14 vendor, shared with the container. egl/ is required: the
#       Adreno driver loads eglSubDriverAndroid.so from it.
#   /usr/libexec/hal-droid/system/lib
#       empty on sol, kept for parity.
HYBRIS_LD_LIBRARY_PATH=/android/hybris/system/lib/bootstrap:/opt/sol-hwc2/lib:/android/hybris/system/lib:/vendor/lib:/vendor/lib/egl:/vendor/lib/hw:/usr/libexec/hal-droid/system/lib

# Present ambient frames by switching the panel to ON for the update and back
# to DOZE_SUSPEND, as hoki and rubyfish do. sol's composer accepts frames
# committed while the panel dozes but never shows them, so the always-on face
# stays black. linux-sol-modules' 0010 display patch guards that ON window
# against autosleep; without it a suspend inside the window turns the panel off.
QPA_HWC2_FORCE_DOZE_UPDATE=1

# HYBRIS_HWC_DISABLE_COMPOSER_USAGE is not set on purpose. aurora sets it, but
# nothing reads it: the UBWC usage fix is the libhybris patch itself, applied
# per machine through SRC_URI. See meta-sol's libhybris bbappend.
