# Order the compositor behind the Android container's composer, which lives
# inside LXC and has no unit to order against.
#
# ExecStartPre waits for the composer process to exist (the boot race).
#
# StartLimitIntervalSec=0 covers the window between the process appearing and
# its AIDL service registering on vndbinder. With systemd's default of 5 starts
# per 10s the launcher used up its retries and stayed failed for the rest of
# the boot; now it retries every RestartSec until the composer answers.
#
# TimeoutStartSec covers ExecStartPre plus the Type=notify handshake; the
# default 90s is shorter than the wait script's 120s budget.
[Unit]
StartLimitIntervalSec=0

[Service]
ExecStartPre=/usr/libexec/sol-wait-composer.sh
TimeoutStartSec=300
RestartSec=5
