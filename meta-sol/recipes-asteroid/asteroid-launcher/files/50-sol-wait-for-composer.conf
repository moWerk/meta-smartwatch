# sol: order the compositor behind the Android container's composer.
#
# The composer lives inside the LXC container, so it has no unit to order
# against. Two changes, each covering a different half of the race:
#
#   ExecStartPre waits for the composer process to exist at all. That is the
#   boot race: without it the launcher runs while Android init is still walking
#   its rc files.
#
#   StartLimitIntervalSec=0 removes the rate limit for the residual window
#   between the process appearing and its AIDL service being registered on
#   vndbinder. Upstream sets Restart=always but inherits systemd's default of 5
#   starts per 10s, so the launcher used to exhaust its retries in ten seconds
#   and stay `failed` for the rest of the boot. With the limit off it simply
#   retries every RestartSec until the composer answers, which is the correct
#   behaviour for the process that IS the user interface -- a compositor that
#   keeps trying beats one that gave up during a slow boot.
#
# TimeoutStartSec covers ExecStartPre plus the Type=notify handshake; the
# default 90s is shorter than the wait script's own 120s budget.
[Unit]
StartLimitIntervalSec=0

[Service]
ExecStartPre=/usr/libexec/sol-wait-composer.sh
TimeoutStartSec=300
RestartSec=5
